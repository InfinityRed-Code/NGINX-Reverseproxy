# Fail2Ban auf dem HOST gegen die nginx-Logs des NRP-Containers.
# NRP_DIR durch das Verzeichnis mit compose.yaml ersetzen (z. B. /opt/nrp).
#
# Der Container veröffentlicht Ports über Docker (DNAT). Sperren müssen deshalb in der
# Chain DOCKER-USER greifen, nicht in INPUT – sonst wirken sie nicht.

[DEFAULT]
bantime  = 24h
findtime = 10m
maxretry = 5
backend  = auto
banaction = iptables-allports
chain    = DOCKER-USER

[nginx-http-auth]
enabled = true
logpath = NRP_DIR/data/logs/nginx/error.log

[nginx-botsearch]
enabled = true
logpath = NRP_DIR/data/logs/nginx/access.log

[nginx-404]
enabled  = true
port     = http,https
filter   = nginx-404
logpath  = NRP_DIR/data/logs/nginx/access.log
maxretry = 30
findtime = 60
bantime  = 12h

# Optional (v2: `nrp f2b enable --with-scanners`)
[nginx-scanners]
enabled  = false
port     = http,https
filter   = nginx-scanners
logpath  = NRP_DIR/data/logs/nginx/access.log
maxretry = 2
findtime = 10m
bantime  = 24h
