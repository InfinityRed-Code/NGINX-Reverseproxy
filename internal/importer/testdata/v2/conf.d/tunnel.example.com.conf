# NGINX Reverse Proxy Configuration for tunnel.example.com (Custom Port: 8444)
# Generated by NRP v2.0

server {
    listen 8444 ssl;
    server_name tunnel.example.com;

    # Zertifikat
    ssl_certificate /etc/letsencrypt/live/tunnel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 2g;

    error_page 497 https://$host:8444$request_uri;

    # Coraza WAF mit globalem Regelwerk (OWASP Core Rule Set)
    coraza on;
    coraza_rules_file /etc/nginx/coraza/main.conf;
    location / {
        proxy_pass https://10.240.0.18:443/;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Scheme $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # Websocket Header
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_http_version 1.1;
    }
}
