# Statisches nginx.conf des NRP-Images (rewrite.md 4.6).
# Kein load_module: Coraza ist statisch einkompiliert.
user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nrp/nginx/error.log warn;

events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nrp/nginx/access.log combined;
    server_tokens off;
    sendfile      on;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Alles Dynamische kommt aus der aktuellen Generation (Symlink).
    # Existiert der Symlink noch nicht (nrpd hat noch nicht gerendert), matcht
    # das Glob nichts und nginx startet ohne Server-Blöcke.
    include /run/nrp/render/current/http.d/*.conf;
}
