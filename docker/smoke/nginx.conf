# Smoke-Test-Config für den Image-Build: lädt Coraza + CRS mit SecRuleEngine On.
# Wird nur von smoke.sh verwendet, nie produktiv.
user nginx;
worker_processes 1;
pid /tmp/nrp-smoke/nginx.pid;
error_log /tmp/nrp-smoke/error.log notice;

events { worker_connections 64; }

http {
    include       /etc/nginx/mime.types;
    access_log    /tmp/nrp-smoke/access.log combined;
    server_tokens off;

    client_body_temp_path /tmp/nrp-smoke/client_temp;
    proxy_temp_path       /tmp/nrp-smoke/proxy_temp;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 127.0.0.1:18080;
        server_name _;

        coraza on;
        coraza_rules_file /usr/share/nrp/smoke/coraza/main.conf;

        # proxy_pass statt `return`: `return` läuft in der Rewrite-Phase, also vor Coraza.
        location / {
            proxy_pass http://127.0.0.1:18081;
        }
    }

    # Dummy-Upstream
    server {
        listen 127.0.0.1:18081;
        location / {
            return 200 "smoke ok\n";
        }
    }
}
