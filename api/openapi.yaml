openapi: 3.0.3
info:
  title: NRP API
  version: "3.0"
  description: |
    Steuerungs-API fuer NRP (NGINX Reverse Proxy). Authentifizierung per mTLS
    (Client-Zertifikat der NRP-CA), optional Bearer-Token, lokal per Unix-Socket.
    Die Mindestrolle je Operation steht im Security-Scope (viewer < operator < admin).
servers:
  - url: /api/v1
security:
  - mtls: [viewer]
tags:
  - {name: hosts}
  - {name: certificates}
  - {name: sites}
  - {name: waf}
  - {name: system}
  - {name: access}

paths:
  /hosts:
    get:
      operationId: listHosts
      tags: [hosts]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HostList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createHost
      tags: [hosts]
      security: [{mtls: [operator]}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HostInput'}}}}
      responses:
        '201': {description: Angelegt; Zertifikatsjob gestartet, content: {application/json: {schema: {$ref: '#/components/schemas/HostCreated'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /hosts/{fqdn}:
    parameters: [{$ref: '#/components/parameters/Fqdn'}]
    get:
      operationId: getHost
      tags: [hosts]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Host'}}}}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: patchHost
      tags: [hosts]
      security: [{mtls: [operator]}]
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/merge-patch+json: {schema: {type: object, additionalProperties: true}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Host'}}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: putHost
      tags: [hosts]
      security: [{mtls: [operator]}]
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HostInput'}}}}
      responses:
        '200': {description: Ersetzt, content: {application/json: {schema: {$ref: '#/components/schemas/Host'}}}}
        '201': {description: Angelegt, content: {application/json: {schema: {$ref: '#/components/schemas/Host'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteHost
      tags: [hosts]
      security: [{mtls: [operator]}]
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {name: keep_cert, in: query, schema: {type: boolean, default: false}}
        - {name: revoke, in: query, schema: {type: boolean, default: false}}
      responses:
        '204': {description: Geloescht}
        default: {$ref: '#/components/responses/Problem'}

  /certificates:
    get:
      operationId: listCertificates
      tags: [certificates]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/CertificateList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /certificates/{fqdn}:
    parameters: [{$ref: '#/components/parameters/Fqdn'}]
    get:
      operationId: getCertificate
      tags: [certificates]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Certificate'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteCertificate
      tags: [certificates]
      security: [{mtls: [admin]}]
      parameters: [{name: revoke, in: query, schema: {type: boolean, default: false}}]
      responses:
        '204': {description: Entfernt}
        '202': {description: Widerruf als Job gestartet, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /certificates/{fqdn}/renew:
    parameters: [{$ref: '#/components/parameters/Fqdn'}]
    post:
      operationId: renewCertificate
      tags: [certificates]
      security: [{mtls: [operator]}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {description: Job gestartet, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /sites:
    get:
      operationId: listSites
      tags: [sites]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SiteList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createSite
      tags: [sites]
      security: [{mtls: [admin]}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SiteInput'}}}}
      responses:
        '201': {description: Angelegt, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /sites/{name}:
    parameters: [{$ref: '#/components/parameters/Name'}]
    get:
      operationId: getSite
      tags: [sites]
      parameters: [{name: live, in: query, schema: {type: boolean, default: false}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: patchSite
      tags: [sites]
      security: [{mtls: [admin]}]
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/merge-patch+json: {schema: {$ref: '#/components/schemas/SitePatch'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteSite
      tags: [sites]
      security: [{mtls: [admin]}]
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {name: keep_config, in: query, schema: {type: boolean, default: false}}
      responses:
        '204': {description: Geloescht bzw. deaktiviert}
        default: {$ref: '#/components/responses/Problem'}
  /sites/{name}/install-script:
    parameters: [{$ref: '#/components/parameters/Name'}]
    get:
      operationId: getSiteInstallScript
      tags: [sites]
      security: [{mtls: [admin]}]
      parameters: [{name: os, in: query, schema: {type: string, enum: [auto, debian, ubuntu, alpine]}}]
      responses:
        '200': {description: Shell-Script (enthaelt den PSK), content: {text/x-shellscript: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Problem'}
  /sites/{name}/public-key:
    parameters: [{$ref: '#/components/parameters/Name'}]
    put:
      operationId: setSitePublicKey
      tags: [sites]
      security: [{mtls: [admin]}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublicKeyInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /sites/{name}/rotate-psk:
    parameters: [{$ref: '#/components/parameters/Name'}]
    post:
      operationId: rotateSitePsk
      tags: [sites]
      security: [{mtls: [admin]}]
      responses:
        '200': {description: Neuer PSK gesetzt, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /waf:
    get:
      operationId: getWaf
      tags: [waf]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Waf'}}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: putWaf
      tags: [waf]
      security: [{mtls: [admin]}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WafInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Waf'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /settings:
    get:
      operationId: getSettings
      tags: [system]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Settings'}}}}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: patchSettings
      tags: [system]
      security: [{mtls: [admin]}]
      requestBody: {required: true, content: {application/merge-patch+json: {schema: {$ref: '#/components/schemas/SettingsPatch'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Settings'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /status:
    get:
      operationId: getStatus
      tags: [system]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /render/current:
    get:
      operationId: getRenderCurrent
      tags: [system]
      security: [{mtls: [admin]}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RenderCurrent'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /render/generations:
    get:
      operationId: listGenerations
      tags: [system]
      security: [{mtls: [admin]}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/GenerationList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /render/rollback:
    post:
      operationId: rollbackRender
      tags: [system]
      security: [{mtls: [admin]}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RollbackInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ReconcileResult'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /render/reconcile:
    post:
      operationId: reconcileRender
      tags: [system]
      security: [{mtls: [admin]}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ReconcileResult'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /jobs:
    get:
      operationId: listJobs
      tags: [system]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: status, in: query, schema: {type: string, enum: [queued, running, succeeded, failed]}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/JobList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /jobs/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getJob
      tags: [system]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /audit:
    get:
      operationId: listAudit
      tags: [system]
      security: [{mtls: [admin]}]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: actor, in: query, schema: {type: string}}
        - {name: resource, in: query, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AuditList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /audit/verify:
    get:
      operationId: verifyAudit
      tags: [system]
      security: [{mtls: [admin]}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AuditVerify'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /audit/prune:
    post:
      operationId: pruneAudit
      tags: [system]
      description: Nur ueber den lokalen Socket bzw. im Offline-Modus erlaubt.
      security: [{mtls: [admin]}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuditPruneInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AuditPruneResult'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /clients:
    get:
      operationId: listClients
      tags: [access]
      security: [{mtls: [admin]}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ApiClientList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createClient
      tags: [access]
      security: [{mtls: [admin]}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApiClientInput'}}}}
      responses:
        '201': {description: Ausgestellt, content: {application/json: {schema: {$ref: '#/components/schemas/ApiClientIssued'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /clients/{name}:
    parameters: [{$ref: '#/components/parameters/Name'}]
    get:
      operationId: getClient
      tags: [access]
      security: [{mtls: [admin]}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ApiClient'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteClient
      tags: [access]
      description: Widerruft den Client (disabled=1). Mit purge=true wird der Eintrag entfernt.
      security: [{mtls: [admin]}]
      parameters: [{name: purge, in: query, schema: {type: boolean, default: false}}]
      responses:
        '204': {description: Widerrufen}
        default: {$ref: '#/components/responses/Problem'}
  /clients/{name}/renew:
    parameters: [{$ref: '#/components/parameters/Name'}]
    post:
      operationId: renewClient
      tags: [access]
      security: [{mtls: [admin]}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApiClientRenewInput'}}}}
      responses:
        '200': {description: Erneuert, content: {application/json: {schema: {$ref: '#/components/schemas/ApiClientIssued'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /tokens:
    get:
      operationId: listTokens
      tags: [access]
      security: [{mtls: [admin]}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TokenList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createToken
      tags: [access]
      security: [{mtls: [admin]}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TokenInput'}}}}
      responses:
        '201': {description: Erstellt; das Secret wird nur hier angezeigt, content: {application/json: {schema: {$ref: '#/components/schemas/TokenIssued'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /tokens/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    delete:
      operationId: deleteToken
      tags: [access]
      security: [{mtls: [admin]}]
      responses:
        '204': {description: Widerrufen}
        default: {$ref: '#/components/responses/Problem'}

  /ca:
    get:
      operationId: getCa
      tags: [access]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ca'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /backup:
    post:
      operationId: createBackup
      tags: [system]
      description: VACUUM INTO in das Backup-Verzeichnis. Nur lokal bzw. offline.
      security: [{mtls: [admin]}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/BackupInput'}}}}
      responses:
        '201': {description: Erstellt, content: {application/json: {schema: {$ref: '#/components/schemas/BackupResult'}}}}
        default: {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    mtls: {type: http, scheme: mutual, description: Client-Zertifikat der NRP-CA; Rolle ueber den Fingerprint in api_clients}
  parameters:
    Fqdn: {name: fqdn, in: path, required: true, schema: {type: string}}
    Name: {name: name, in: path, required: true, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    IfMatch: {name: If-Match, in: header, description: 'ETag aus einem vorherigen GET ("<version>")', schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 128}}
  responses:
    Problem:
      description: Fehler nach RFC 9457
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        request_id: {type: string}
    Role: {type: string, enum: [viewer, operator, admin]}
    WafMode: {type: string, enum: ['On', DetectionOnly, 'Off']}
    Hsts:
      type: object
      required: [max_age, include_subdomains, preload]
      properties:
        max_age: {type: integer, format: int64, minimum: 0}
        include_subdomains: {type: boolean}
        preload: {type: boolean}
    Upstream:
      type: object
      required: [scheme, address, port]
      properties:
        scheme: {type: string, enum: [http, https]}
        address: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        site: {type: string, nullable: true}
    HostInput:
      type: object
      required: [upstream]
      properties:
        fqdn: {type: string}
        upstream: {$ref: '#/components/schemas/Upstream'}
        external_port: {type: integer, minimum: 1, maximum: 65535, default: 443}
        websockets: {type: boolean, default: false}
        waf: {type: boolean, default: false}
        client_max_body_size: {type: string, nullable: true}
        hsts: {allOf: [{$ref: '#/components/schemas/Hsts'}], nullable: true}
        acme_email: {type: string, nullable: true}
    CertificateSummary:
      type: object
      required: [not_after, issuer]
      properties:
        not_after: {type: string, format: date-time}
        issuer: {type: string}
    Host:
      type: object
      required: [fqdn, upstream, external_port, websockets, waf, status, version, created_at, updated_at]
      properties:
        fqdn: {type: string}
        upstream: {$ref: '#/components/schemas/Upstream'}
        external_port: {type: integer}
        websockets: {type: boolean}
        waf: {type: boolean}
        client_max_body_size: {type: string, nullable: true}
        hsts: {allOf: [{$ref: '#/components/schemas/Hsts'}], nullable: true}
        acme_email: {type: string, nullable: true}
        status: {type: string, enum: [pending_certificate, active, error]}
        status_detail: {type: string, nullable: true}
        certificate: {allOf: [{$ref: '#/components/schemas/CertificateSummary'}], nullable: true}
        version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    HostCreated:
      type: object
      required: [host]
      properties:
        host: {$ref: '#/components/schemas/Host'}
        job: {$ref: '#/components/schemas/Job'}
    HostList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Host'}}
        next_cursor: {type: string, nullable: true}
    Certificate:
      type: object
      required: [fqdn, not_before, not_after, issuer, source, updated_at, days_left]
      properties:
        fqdn: {type: string}
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time}
        ari_renew_at: {type: string, format: date-time, nullable: true}
        issuer: {type: string}
        source: {type: string, enum: [acme, imported]}
        updated_at: {type: string, format: date-time}
        days_left: {type: integer}
        chain_pem: {type: string, description: Nur in der Detailansicht}
    CertificateList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Certificate'}}
    SiteInput:
      type: object
      required: [name]
      properties:
        name: {type: string}
        targets: {type: integer, minimum: 1}
        subnet_prefix: {type: integer, minimum: 16, maximum: 30}
        email: {type: string, nullable: true}
        os_hint: {type: string, enum: [debian, ubuntu, alpine], nullable: true}
        lan_cidr: {type: string, nullable: true}
        notes: {type: string, nullable: true}
    SitePatch:
      type: object
      properties:
        email: {type: string, nullable: true}
        os_hint: {type: string, nullable: true}
        lan_cidr: {type: string, nullable: true}
        notes: {type: string, nullable: true}
        enabled: {type: boolean}
    SiteLive:
      type: object
      required: [online, rx_bytes, tx_bytes]
      properties:
        online: {type: boolean}
        last_handshake: {type: string, format: date-time, nullable: true}
        endpoint: {type: string, nullable: true}
        rx_bytes: {type: integer, format: int64}
        tx_bytes: {type: integer, format: int64}
    Site:
      type: object
      required: [name, subnet, connector_ip, has_psk, enabled, status, version, created_at, updated_at]
      properties:
        name: {type: string}
        subnet: {type: string}
        connector_ip: {type: string}
        lan_cidr: {type: string, nullable: true}
        public_key: {type: string, nullable: true}
        has_psk: {type: boolean}
        os_hint: {type: string, nullable: true}
        email: {type: string, nullable: true}
        enabled: {type: boolean}
        status: {type: string, enum: [pending, online, offline]}
        last_seen_at: {type: string, format: date-time, nullable: true}
        notes: {type: string, nullable: true}
        live: {$ref: '#/components/schemas/SiteLive'}
        version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SiteList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Site'}}
    PublicKeyInput:
      type: object
      required: [public_key]
      properties:
        public_key: {type: string}
    Waf:
      type: object
      required: [mode, crs_version, hosts, overrides]
      properties:
        mode: {$ref: '#/components/schemas/WafMode'}
        crs_version: {type: string}
        hosts: {type: array, items: {type: string}}
        overrides: {type: string}
    WafInput:
      type: object
      properties:
        mode: {$ref: '#/components/schemas/WafMode'}
        overrides: {type: string}
    Settings:
      type: object
      required: [client_max_body_size, hsts]
      properties:
        client_max_body_size: {type: string}
        hsts: {$ref: '#/components/schemas/Hsts'}
        acme_email: {type: string, nullable: true}
    SettingsPatch:
      type: object
      properties:
        client_max_body_size: {type: string}
        hsts: {$ref: '#/components/schemas/Hsts'}
        acme_email: {type: string, nullable: true}
    Status:
      type: object
      required: [version, mode, nginx, render, hosts, certificates, wireguard, jobs, waf]
      properties:
        version: {type: string}
        mode: {type: string, enum: [service, offline]}
        nginx:
